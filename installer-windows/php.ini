; WebDevHub — bundled PHP runtime ke liye php.ini (Windows)
; Ye file installer ke runtime\php folder mein php.ini ban kar jati hai.
; Sirf local dev ke liye hai (127.0.0.1) — phir bhi mehfooz defaults.

extension_dir = "ext"

; WordPress + plugins ke liye zaroori extensions
extension = curl
extension = exif
extension = fileinfo
extension = gd
extension = gettext
extension = intl
extension = mbstring
extension = mysqli
extension = openssl
extension = pdo_mysql
extension = pdo_sqlite
extension = sodium
extension = sqlite3
extension = zip

memory_limit = 512M
max_execution_time = 300
post_max_size = 256M
upload_max_filesize = 256M
max_file_uploads = 40

display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
date.timezone = UTC

; Built-in server ke liye: har request par OPcache nahi — dev mein
; file tabdeeli foran nazar ani chahiye.
opcache.enable = Off
opcache.enable_cli = Off

variables_order = "GPCS"
allow_url_fopen = On
