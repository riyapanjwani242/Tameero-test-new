name: Windows Build

# Windows build/test GitHub ke Windows runners par hoti hai (owner usool #3).
# Inno compile + install smoke: installer chalta hai, files verify hoti hain.
on:
  push:
    # Version tag (v*) par bhi build chale taake neeche wala release step
    # usi green build ka installer Release mein attach kar sake.
    tags:
      - "v*"
    paths:
      - "installer-windows/**"
      - "bundle/**"
      - "themes/**"
      - "panel/**"
      - "tests/**"
      - "installer-linux/setup-site.php"
      - "installer-linux/wc-tool.php"
      - "installer-linux/router.php"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Release banane ke liye sirf contents:write — baqi default read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bundle fetch (pinned WP + plugins)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle/wordpress/dist, bundle/plugins/dist | Out-Null
          # WP version bundle/manifest.json se — yahi ek source of truth
          # hai (bug 2026-10-30: yahan 6.8.3 hardcoded reh gaya tha, to
          # bundle update ke bawajood Windows installer purana WP 6.8.3
          # ship karta raha jabke plugins naye thay).
          $bm = Get-Content bundle/manifest.json | ConvertFrom-Json
          Invoke-WebRequest $bm.wordpress.url -OutFile ("bundle/wordpress/dist/wordpress-" + $bm.wordpress.version + ".zip")
          # Plugins: manifest ke pinned URLs
          $m = Get-Content bundle/plugins/manifest.json | ConvertFrom-Json
          foreach ($p in $m.plugins) {
            if ($p.url -like "https://downloads.wordpress.org*") {
              $name = Split-Path $p.url -Leaf
              Invoke-WebRequest $p.url -OutFile "bundle/plugins/dist/$name"
            }
          }
          # SQLite plugin bhi manifest ke PIN se (v2.6.3) — latest wali URL nahi
          Invoke-WebRequest $bm.sqlite_plugin.url -OutFile "bundle/plugins/dist/sqlite-database-integration.zip"
          # Dukaan theme: download nahi — repo source se zip banti hai
          # (fetch-bundle.sh wala hi shared script, taake dono builds
          # mein ek jaisa zip bane)
          New-Item -ItemType Directory -Force bundle/themes/dist | Out-Null
          python bundle/make-theme-zip.py themes/dukaan-fse bundle/themes/dist/dukaan-fse.zip dukaan-fse
          if ($LASTEXITCODE -ne 0) { throw "Theme zip nahi bana" }

      - name: PHP runtime fetch (PHP 8.4.27 + VC++ redist)
        shell: pwsh
        run: pwsh installer-windows/fetch-runtime.ps1

      # Build-time compatibility guard (v2.6.3, Phase A-4): asal
      # payload files se WP version + har plugin ki "Requires at
      # least" parh kar jora verify hota hai. Incompatible jora
      # ho to build YAHIN ruk jati hai — installer banta hi nahi.
      - name: Compatibility guard (payload asal versions)
        shell: pwsh
        run: |
          $php = Get-ChildItem runtime -Recurse -Filter php.exe | Select-Object -First 1 -ExpandProperty FullName
          if (!$php) { throw "PHP runtime nahi mila — compat guard nahi chal sakta" }
          & $php tools/compat-check.php
          if ($LASTEXITCODE -ne 0) { throw "Compatibility guard FAIL — bundle ka jora incompatible hai" }

      - name: Inno Setup install
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer-windows/webdevhub.iss
          # Version .iss se ata hai — yahan hardcoded naam kabhi
          # dobara nahi fasna chahiye (v2.4.0 par Run #9 isi se gira).
          if (!(Get-ChildItem "build/windows/*_Setup_v*.exe" -ErrorAction SilentlyContinue)) { throw "Installer compile fail" }

      - name: Install smoke (asal imtihan — install, dashboard, site, admin)
        shell: pwsh
        run: pwsh tests/smoke-windows.ps1

      # Smoke fail ho to wajah ke saboot artifacts mein — job logs
      # se pata chalta hai creation kis step par ruki (v2.6.2).
      - name: Diagnostics ikattha karo (fail par)
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $sites = "$env:LOCALAPPDATA\Programs\WebDevHub\sites"
          if (Test-Path $sites) { Copy-Item "$sites\*.job.log" diagnostics -ErrorAction SilentlyContinue }
          $dlog = "$env:LOCALAPPDATA\Programs\WebDevHub\panel\.dashboard.log"
          # State file bhi: is se pata chalta hai launcher ne
          # upload_port ka dawa kiya tha ya nahi (v2.8.2, run #25).
          # Nuqta: smoke ka finally block Stop-Dashboard se PEHLE
          # state + log + trace TEMP mein mehfooz karta hai, kyunke
          # stop_hub.vbs state file delete kar deta hai. Seedha
          # panel se copy sirf tab kaam ata hai jab finally chala
          # hi na ho (jaise v2.8.3 run #26 mein section 3 par fail).
          $state = "$env:LOCALAPPDATA\Programs\WebDevHub\panel\.dashboard-state.json"
          $trace = "$env:LOCALAPPDATA\Programs\WebDevHub\panel\.launcher-trace.log"
          $clog = "$env:LOCALAPPDATA\Programs\WebDevHub\panel\.dashboard-companion.log"
          $itrace = "$env:LOCALAPPDATA\Programs\WebDevHub\panel\.import-trace.log"
          # v2.8.6: diagnostics folder mein NON-DOT naam se copy
          # karo. Run #28 ka sabak: dot-prefixed files folder mein
          # mojood thin (inventory ne dikhaya) phir bhi upload ne
          # "No files found" kaha - upload-artifact ka directory
          # glob dotfiles nahi uthata. Panel-direct copies explicit
          # path se thin, phir bhi nahi uthin - is liye glob nahi,
          # naam hi masla hai. Ye rename us hypothesis ko seedha
          # azmata hai: agla artifact ban gaya to confirm.
          if (Test-Path $dlog) { Copy-Item $dlog diagnostics\dashboard.log -ErrorAction SilentlyContinue }
          if (Test-Path $state) { Copy-Item $state diagnostics\dashboard-state.json -ErrorAction SilentlyContinue }
          if (Test-Path $trace) { Copy-Item $trace diagnostics\launcher-trace.log -ErrorAction SilentlyContinue }
          if (Test-Path $clog) { Copy-Item $clog diagnostics\dashboard-companion.log -ErrorAction SilentlyContinue }
          if (Test-Path $itrace) { Copy-Item $itrace diagnostics\import-trace.log -ErrorAction SilentlyContinue }
          # v2.8.10: upload watcher log TEMP mein rehta hai (panel mein
          # nahi) - seedha copy bhi lo, taake finally na chala ho tab
          # bhi mile; finally wali copy fallback pair se aayegi.
          $watch = "$env:TEMP\TAMEERO-upload-watch.log"
          if (Test-Path $watch) { Copy-Item $watch diagnostics\upload-watch.log -ErrorAction SilentlyContinue }
          # Fallback copies (smoke finally ne dot-naam se mehfooz
          # ki thin) bhi non-dot naam se, taake upload unhe uthaye.
          foreach ($pair in @(("dashboard-state.json", ".dashboard-state.json"), ("dashboard.log", ".dashboard.log"), ("dashboard-companion.log", ".dashboard-companion.log"), ("launcher-trace.log", ".launcher-trace.log"), ("import-trace.log", ".import-trace.log"), ("upload-watch.log", "TAMEERO-upload-watch.log"))) {
            $dst = $pair[0]; $srcName = $pair[1]
            if (Test-Path "$env:TEMP\TAMEERO-diagnostics\$srcName") { Copy-Item "$env:TEMP\TAMEERO-diagnostics\$srcName" "diagnostics\$dst" -ErrorAction SilentlyContinue }
            if (Test-Path "$env:GITHUB_WORKSPACE\TAMEERO-diagnostics\$srcName") { Copy-Item "$env:GITHUB_WORKSPACE\TAMEERO-diagnostics\$srcName" "diagnostics\$dst" -ErrorAction SilentlyContinue }
          }
          # v2.8.5: collection khamosh nahi rahegi - job log mein
          # inventory print karo taake agle fail par exact pata
          # chale ke kaunsi file kahan mili ya nahi mili.
          Write-Host "DIAG-SOURCES state:$(Test-Path $state) log:$(Test-Path $dlog) clog:$(Test-Path $clog) trace:$(Test-Path $trace) itrace:$(Test-Path $itrace) watch:$(Test-Path $watch) temp:$(Test-Path "$env:TEMP\TAMEERO-diagnostics") workspace:$(Test-Path "$env:GITHUB_WORKSPACE\TAMEERO-diagnostics")"
          Write-Host "DIAG-INVENTORY diagnostics folder:"
          Get-ChildItem diagnostics | ForEach-Object { Write-Host "DIAG-INVENTORY $($_.Name) $($_.Length)" }

      - name: Upload diagnostics (fail par)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TAMEERO-Windows-Diagnostics
          path: diagnostics
          if-no-files-found: warn

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAMEERO-Windows-Installer
          path: build/windows/*.exe

      # Mustaqil hal (owner order 2026-10-30): version tag push ho to build
      # ke baad khud Release ban jaye aur installer asset attach ho jaye.
      # Aam branch pushes par ye step skip rehta hai (if wali shart).
      - name: Release banana (sirf version tag v* par)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/*.exe
          fail_on_unmatched_files: true
