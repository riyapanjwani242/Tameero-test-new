name: Windows Build

# Windows build/test GitHub ke Windows runners par hoti hai (owner usool #3).
# Inno compile + install smoke: installer chalta hai, files verify hoti hain.
on:
  push:
    paths:
      - "installer-windows/**"
      - "bundle/**"
      - "panel/**"
      - "tests/**"
      - "installer-linux/setup-site.php"
      - "installer-linux/router.php"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bundle fetch (pinned WP + plugins)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle/wordpress/dist, bundle/plugins/dist | Out-Null
          Invoke-WebRequest "https://wordpress.org/wordpress-6.8.3.zip" -OutFile "bundle/wordpress/dist/wordpress-6.8.3.zip"
          # Plugins: manifest ke pinned URLs
          $m = Get-Content bundle/plugins/manifest.json | ConvertFrom-Json
          foreach ($p in $m.plugins) {
            if ($p.url -like "https://downloads.wordpress.org*") {
              $name = Split-Path $p.url -Leaf
              Invoke-WebRequest $p.url -OutFile "bundle/plugins/dist/$name"
            }
          }
          Invoke-WebRequest "https://downloads.wordpress.org/plugin/sqlite-database-integration.zip" -OutFile "bundle/plugins/dist/sqlite-database-integration.zip"

      - name: PHP runtime fetch (PHP 8.4.27 + VC++ redist)
        shell: pwsh
        run: pwsh installer-windows/fetch-runtime.ps1

      - name: Inno Setup install
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer-windows/webdevhub.iss
          # Version .iss se ata hai — yahan hardcoded naam kabhi
          # dobara nahi fasna chahiye (v2.4.0 par Run #9 isi se gira).
          if (!(Get-ChildItem "build/windows/WebDevHub_Setup_v*.exe" -ErrorAction SilentlyContinue)) { throw "Installer compile fail" }

      - name: Install smoke (asal imtihan — install, dashboard, site, admin)
        shell: pwsh
        run: pwsh tests/smoke-windows.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDevHub-Windows-Installer
          path: build/windows/*.exe
